name: Juego (Godot)

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  arquitectura:
    name: Regla de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar las capas de Clean Architecture
        run: bash android/tests/architecture/check_dependencies.sh

  pruebas:
    name: Pruebas con GdUnit4
    runs-on: ubuntu-latest
    needs: arquitectura
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Godot ${{ env.GODOT_VERSION }}
        run: |
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo mv "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --version
      - name: Importar el proyecto
        run: godot --headless --path . --import
      - name: Ejecutar las pruebas
        run: |
          godot --headless --path . -s -d --remote-debug tcp://127.0.0.1:0 \
            res://addons/gdUnit4/bin/GdUnitCmdTool.gd --ignoreHeadlessMode -a res://tests -c
      - name: Guardar el reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-de-pruebas
          path: android/reports/
          if-no-files-found: ignore
